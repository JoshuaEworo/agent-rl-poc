model: inclusionAI/Ling-3.0-tiny
seed: 2026
train_split: train
eval_split: dev
artifact_dir: artifacts/smoke

rollout:
  max_turns: 6
  max_tool_calls: 8
  timeout_seconds: 300
  max_generated_tokens: 512
  repeated_action_limit: 2
  temperature: 0.8
  step_penalty: 0.01

train:
  algorithm: gspo
  train_tasks: 2
  eval_tasks: 2
  rollouts_per_task: 2
  max_steps: 1
  batch_size: 1
  micro_batch_size: 1
  gradient_accumulation: 1
  lora_rank: 4
  lora_alpha: 8
  learning_rate: 0.000001
  max_prompt_tokens: 1536
  max_context_length: 8192
  lora_targets:
    - q_proj
    - k_proj
    - v_proj
    - f_proj
    - g_proj
    - o_proj
    - q_a_proj
    - q_b_proj
    - kv_a_proj_with_mqa
    - kv_b_proj
    - dense
